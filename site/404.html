<style>

  :root { --bg: #efece3; --sheet: #f8f6ef; --ink: #18202c; --ink-2: #3b4555; --ink-3: #5d6878; --line: #18202c; --rule-2: #b5af9f;

  @media (prefers-color-scheme: dark) {

  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink);
    font: 400 17px/1.6 "Atkinson Hyperlegible Next", system-ui, sans-serif; }
  .sheet { position: relative; width: min(640px, 100%); padding: 40px 34px 30px; background: var(--sheet); border: 1px solid var(--line); box-shadow: var(--shadow); }

  .tab { position: absolute; top: -1px; left: -1px; padding: 6px 10px; background: var(--ink); color: var(--sheet);

  h1 { margin: 10px 0 4px; font: 800 clamp(72px, 18vw, 120px)/1 "Martian Mono", monospace; font-stretch: 112.5%; letter-spacing: -.02em; position: relative; width: max-content; }
  h1::before, h1::after { content: ""; position: absolute; left: -14px; right: -48px; height: 1px; background: var(--npb); }
  h1::before { top: .1em; } h1::after { top: .9em; }
  .hand { font: 400 19px "Architects Daughter", cursive; color: var(--redline); margin: 0 0 18px; }
  p { margin: 0 0 22px; color: var(--ink-2); }
  a.back { display: inline-block; padding: 11px 15px; background: var(--ink); color: var(--bg); text-decoration: none;
    font: 700 11px/1 "Martian Mono", monospace; font-stretch: 87.5%; letter-spacing: .14em; text-transform: uppercase; box-shadow: var(--shadow); }
  a.back:hover { background: var(--accent); }
  a:focus-visible { outline: 2px dashed var(--accent); outline-offset: 3px; }
  .tb { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 30px; border: 1px solid var(--line);

  .tb div { padding: 7px 10px 8px; border-left: 1px solid var(--line); }
  .tb div:first-child { border-left: 0; }
  .tb span { display: block; margin-bottom: 5px; font-size: 8.5px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-3); }
